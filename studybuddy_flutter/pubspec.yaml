name: studybuddy_flutter
description: "StudyBuddy - AI-powered learning assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  http: ^1.2.2
  http_parser: ^4.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_pdfview: ^1.4.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#0F0A1E"
  color_dark: "#0F0A1E"
  image: assets/images/logo_dark.png
  android_12:
    color: "#0F0A1E"
    color_dark: "#0F0A1E"
    image: assets/images/logo_dark.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0A1E"
  adaptive_icon_foreground: "assets/images/logo.png"
